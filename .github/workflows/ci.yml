name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：只有 checkout 需要读权限
permissions:
  contents: read

jobs:
  go:
    name: go (build / vet / test)
    runs-on: ubuntu-latest
    # store 的回归用例需要真实 PostgreSQL（未设置 AUTH_TEST_DSN 时它们自己 t.Skip）。
    # 这里起临时库把回归也跑起来，等价于本地：
    #   AUTH_TEST_DSN='postgres://postgres:****@127.0.0.1:5432/metafusion_auth_test?sslmode=disable' go test ./...
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: metafusion_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # 库名必须含 _test：testutil.DSN 会拒绝非独立测试库
      # testutil 只校验 DSN 非空且库名含 _test；lib/pq 默认要 TLS，故显式 sslmode=disable
      AUTH_TEST_DSN: postgres://postgres:test-only-password@127.0.0.1:5432/metafusion_auth_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"   # 与 go.mod 的 go 指令一致
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        # -p 1：internal/store 与 internal/handler 都有真实库用例，且 store 的历史用例会
        # 清空 auth.users；包级并行时会互相踩（本地带 AUTH_TEST_DSN 跑同理）。
        run: go test -p 1 ./...

  # 账号域自带的管理台（admin/）：独立应用，与 Go 后端同仓库但互不依赖，
  # 校验口径与主仓库 frontend job 一致（Bun + i18n 断言 + tsc + next build）。
  admin-ui:
    name: admin ui (bun install / i18n / tsc / next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"   # 与 packageManager 字段一致
      - name: bun install
        run: bun install --frozen-lockfile
      - name: i18n 一致性（四语键集合 + 源码引用）
        run: bun run i18n:check
      - name: tsc --noEmit
        run: bunx tsc --noEmit
      - name: next build
        run: bunx next build
